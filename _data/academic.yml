experience:
  - organization: "将闲科技（LiberAI）"
    role: "机器人运动控制实习生"
    period: "2026.05 — 2026.09"
    summary: "开发在线负载辨识系统，参与运控系统设计、双臂遥操作维护及模型动作部署；完成 Tidybot 舵轮底盘运动学解算与真机部署，负责 Leo 机器人模型构建与参数校正。"
    details:
      - "运控系统与动作部署：负责开发在线负载辨识系统，参与运动控制系统设计与双臂遥操作系统维护；协同模型组开展上层模型的真机部署与联调，处理控制器参数、动作缓冲区、插值与滤波等问题，支持遥操作与模型输出动作的安全、精确执行。"
      - "底盘控制与真机联调：完成 Tidybot 八电机舵轮底盘正、逆运动学解算、零力矩点处理及真机部署，开展底层硬件与上层控制模块联合调试，并将功能封装为 SDK 便于调用。"
      - "机器人建模与参数校正：负责 Leo 机器人 URDF / MJCF 模型构建与校正，完成连杆质量与惯性参数、关节坐标系、碰撞几何等模型配置及调试，支撑机器人运动学、动力学与碰撞仿真验证。"
    technologies: "运动控制 · 在线负载辨识 · 底盘运动学 · 双臂遥操作 · URDF / MJCF · MuJoCo · SDK 封装"

projects:
  - name_zh: "机械臂在线负载辨识与动力学估计"
    name_en: "Online Payload Identification and Dynamics Estimation"
    category: "LiberAI · 开发项目"
    period_zh: "2026.05 — 2026.09"
    summary: "基于动力学回归模型、RLS 与 MHE，利用任务执行中的反馈数据在线估计末端负载，为负载补偿提供参数依据。"
    background: "模型输出的 Action Chunks 为相对运动量。当模型控制机械臂时，由于末端未知负载未被重力补偿，机械臂会持续缓慢下垂。该项目通过在线负载辨识，为负载补偿提供参数依据。"
    details:
      - "检索机械臂动力学参数辨识与在线负载估计相关论文，对比递推最小二乘（RLS）与滚动时域估计（MHE）的建模假设、实时性及噪声鲁棒性。"
      - "基于动力学回归模型、凸优化、RLS 与 MHE 开发在线负载辨识系统，无需运行专用辨识轨迹，利用任务反馈在后台实时估计末端负载。"
      - "设计摩擦力与机械臂动力学参数辨识方案，降低模型误差对在线负载估计的影响。"
      - "SDK 封装与接口设计：将负载辨识算法封装为可复用模块，提供状态输入与估计结果输出接口，支持运控系统集成调用。"
    technologies: "动力学回归 · RLS · MHE · 摩擦辨识 · 在线参数估计 · SDK 封装"
    anchor: "payload-identification"
    featured: true
  - name_zh: "基于视觉语言大模型的机械臂智能抓取研究"
    name_en: "Vision-Language-Guided Robotic Grasping"
    category: "本科毕业设计"
    period_zh: "2025.06 — 2026.04"
    summary: "在 Franka 七自由度机械臂上集成 Qwen3-VL、SAM 与 GraspNet，结合阻抗控制与力位混合控制，完成从自然语言指令、目标感知、抓取位姿生成到真机执行的闭环。"
    details:
      - "基于 Ubuntu 与 ROS2 搭建 Franka 机械臂抓取系统，设计自然语言指令驱动的任务流程，完成感知、规划与控制模块集成及真机联调。"
      - "设计并应用关节空间与笛卡尔空间阻抗控制、力位混合控制，完成目标抓取位姿到机械臂动作执行的控制流程。"
      - "集成 Qwen3-VL、SAM 与 GraspNet，实现指令理解、目标识别与定位、图像分割和抓取位姿生成，并对接机械臂控制模块。"
    technologies: "ROS2 · Franka · 阻抗控制 · 力位混合控制 · VLM（Qwen3-VL）· SAM · GraspNet"
    video: "/毕业设计抓取视频.mp4"
    anchor: "grasping"
    featured: true

