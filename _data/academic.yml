bio:
  summary_zh: "我是刘华强，目前在哈尔滨工业大学航天学院攻读控制科学与工程硕士学位，本科毕业于哈尔滨工业大学自动化专业。我的兴趣主要集中在机器人运动控制、动力学参数辨识与机器人操作，关注算法在真实机器人系统中的实现与验证。"
  experience_zh: "曾在将闲科技（LiberAI）担任机器人运动控制实习生，开发机械臂在线负载辨识系统，完成 Tidybot 舵轮底盘运动学解算与真机部署，负责 Leo 机器人模型构建与校正，并参与双臂遥操作维护及模型动作部署。本科期间完成了基于视觉语言大模型的 Franka 机械臂抓取系统，积累了阻抗控制、力位混合控制与感知控制闭环集成经验。"

